template_id: aiboot_result_v1
name: AIBOOT 결과보고 표준양식 (행사·견학·특강형)
fields:
- key: 운영일정
  type: table
  columns:
  - 날짜
  - 시간
  - 내용
  - 비고
  required: true
  binding: actual.운영일정|plan.세부프로그램
  guide: 날짜는 같은 날이면 첫 행에만
- key: 계획대비실적
  type: table
  columns:
  - 항목
  - 계획
  - 실적
  - 달성률
  required: true
  binding: comparison.rows
- key: 예산집행내역
  type: table
  columns:
  - 예산과목
  - 세부항목
  - 산출내역
  - 금액
  required: true
  binding: budget.rows
- key: 만족도문항
  type: block
  columns:
  - 문항
  - 응답분포
  - 분석
  - 차트
  required: true
  binding: survey.items
  ai_subfields:
  - 분석
  guide: '분석: 제공된 비율·인원 수치만 사용해 1~2문장, ''~분석되었습니다/~파악됩니다'' 체'
  max_chars: 200
- key: 향후계획
  type: block
  columns:
  - 제목
  - 내용
  required: true
  ai_subfields:
  - 제목
  - 내용
  guide: 2~3개. 제목은 10자 내외 명사형, 내용은 1~2문장 '~합니다' 체
  max_chars: 600
- key: 사업단명
  type: text
  required: true
  binding: plan.사업단명|actual.사업단명
  guide: '사업단 이름. 예: AI인재양성부트캠프 사업'
- key: 보고서제목
  type: paragraph
  required: true
  binding: calc.보고서제목
  guide: 제목 상자 2~3줄. 마지막 줄은 '결과보고'로 끝남
- key: 추진배경
  type: paragraph
  required: true
  guide: 2~3개 항목, 각 1~2문장. '~필요', '~하고자 함' 등 명사형/개조식 어미
  max_chars: 400
  source_hint: plan
- key: 추진목적
  type: paragraph
  required: true
  guide: 2~3개 항목, 각 1~2문장. 개조식(~제고, ~강화, ~확대)
  max_chars: 400
  source_hint: plan
- key: 행사명
  type: text
  required: true
  binding: actual.행사명|plan.행사명|plan.사업명
- key: 행사일시
  type: date
  required: true
  binding: calc.행사일시
- key: 장소
  type: text
  required: true
  binding: actual.장소|plan.장소
- key: 대상
  type: text
  required: true
  binding: actual.대상|plan.대상
- key: 참여인원
  type: number
  required: true
  binding: calc.참여인원_표시
- key: 주요추진내용
  type: paragraph
  required: true
  guide: 실제 운영한 주요 프로그램 2~4개, 각 한 줄 명사형
  max_chars: 300
  source_hint: both
- key: 성과제목
  type: text
  required: true
  guide: '운영 결과를 요약하는 20자 이내 소제목(명사형). 예: 현장 중심 실무 교육 기반 강화'
  max_chars: 30
- key: 운영결과
  type: paragraph
  required: true
  guide: 운영 결과 서술 1문단 2~3문장, '~하였습니다' 체. 일시·장소·인원 등 사실 위주
  max_chars: 350
  source_hint: actual
- key: 만족도요약
  type: paragraph
  required: true
  guide: 만족도 조사 개요 1문단(응답자 수, 전반적 평가). '~도출되었습니다' 체
  max_chars: 250
  source_hint: actual
- key: 조사기간
  type: text
  required: true
  binding: survey.조사기간
- key: 조사대상
  type: text
  required: true
  binding: survey.조사대상
- key: 응답자수
  type: text
  required: true
  binding: survey.응답자수_표시
- key: 조사방법
  type: text
  required: true
  binding: survey.조사방법
- key: 활용목적
  type: text
  required: true
  binding: survey.활용목적
- key: 주요성과
  type: paragraph
  required: true
  guide: 3~4개 항목, 각 한 줄. 성과를 명사형으로(~향상, ~확보, ~구축)
  max_chars: 400
  source_hint: both
- key: 재원
  type: text
  required: true
  binding: actual.재원|plan.재원
- key: 예산총액
  type: number
  required: true
  binding: calc.집행총액_표시
- key: 예산합계
  type: number
  required: true
  binding: calc.집행총액_표시
- key: 사진1
  type: image
  required: false
  binding: photos.0
- key: 사진2
  type: image
  required: false
  binding: photos.1
- key: 사진3
  type: image
  required: false
  binding: photos.2
- key: 사진4
  type: image
  required: false
  binding: photos.3
- key: 사진5
  type: image
  required: false
  binding: photos.4
- key: 사진6
  type: image
  required: false
  binding: photos.5
- key: 사진7
  type: image
  required: false
  binding: photos.6
- key: 사진8
  type: image
  required: false
  binding: photos.7
